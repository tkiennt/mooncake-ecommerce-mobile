name: mooncake_mobile
description: "Nguyet Pho B2B & B2C Mooncake Platform - Mobile Application in Flutter"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Routing & Navigation
  go_router: ^14.2.0

  # State Management
  flutter_riverpod: ^2.5.1

  # Networking & Realtime
  dio: ^5.4.3+1
  pretty_dio_logger: ^1.3.1
  signalr_netcore: ^1.3.9

  # Local Storage & Security
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.2.2

  # UI & Styling Utilities
  flutter_staggered_grid_view: ^0.7.0
  cached_network_image: ^3.3.1
  pinput: ^5.0.0
  signature: ^5.4.1
  intl: ^0.19.0
  ionicons: ^0.2.2
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/products/
